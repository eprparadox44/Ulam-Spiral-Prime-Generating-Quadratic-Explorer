name: Publish v1.4.4 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_v1_4_4_once.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'eprparadox44/Ulam-Spiral-Prime-Generating-Quadratic-Explorer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package and checksum
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py --require-node
          sha256sum -c checksums_v1.4.4.sha256
      - name: Run all mathematical, persistence, geometry and Worker regressions
        run: bash tests/run_all.sh
      - name: Publish v1.4.4 release with HTML and SHA256 manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.4.4 >/dev/null 2>&1; then
            echo 'Release already published'
          else
            gh release create v1.4.4 \
              'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.4.html' \
              checksums_v1.4.4.sha256 \
              --target "${{ github.sha }}" \
              --title 'v1.4.4 — Klauber 1/8 Visible-Line Search' \
              --notes-file RELEASE_NOTES_v1.4.4.md \
              --latest
          fi
      - name: Verify published downloadable files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release view v1.4.4 --json tagName,name,isDraft,isPrerelease,assets
          gh release download v1.4.4 -p '*.html' -p '*.sha256' --dir "$RUNNER_TEMP/release"
          expected="$(sha256sum 'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.4.html' | cut -d' ' -f1)"
          actual="$(sha256sum "$RUNNER_TEMP/release/"*.html | cut -d' ' -f1)"
          test "$expected" = "$actual"
          cmp -s checksums_v1.4.4.sha256 "$RUNNER_TEMP/release/checksums_v1.4.4.sha256"
