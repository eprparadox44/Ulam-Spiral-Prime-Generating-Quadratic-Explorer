name: Publish v1.4.5 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_v1_4_5_once.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'eprparadox44/Ulam-Spiral-Prime-Generating-Quadratic-Explorer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone files, checksum, license and JavaScript syntax
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py --require-node
          sha256sum -c checksums_v1.4.5.sha256
      - name: Execute complete mathematical, geometry and Worker regressions
        run: bash tests/run_all.sh
      - name: Create GitHub v1.4.5 release and attach verified HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.4.5 >/dev/null 2>&1; then
            echo 'v1.4.5 already exists'
          else
            gh release create v1.4.5 \
              'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.5.html' \
              checksums_v1.4.5.sha256 \
              --target 0f3b6166392ba406b0ae8c4b02dedc2dad0f43b6 \
              --title 'v1.4.5 — Hexagonal Minimap Boundary Fix' \
              --notes-file RELEASE_NOTES_v1.4.5.md \
              --latest
          fi
      - name: Verify published release is downloadable and identical
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v1.4.5 --json tagName,name,isDraft,isPrerelease,assets
          mkdir -p "$RUNNER_TEMP/release"
          gh release download v1.4.5 -p '*.html' -p '*.sha256' --dir "$RUNNER_TEMP/release"
          expected="$(sha256sum 'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.5.html' | cut -d' ' -f1)"
          actual="$(sha256sum "$RUNNER_TEMP/release/"*.html | cut -d' ' -f1)"
          test "$expected" = "$actual"
          cmp -s checksums_v1.4.5.sha256 "$RUNNER_TEMP/release/checksums_v1.4.5.sha256"
