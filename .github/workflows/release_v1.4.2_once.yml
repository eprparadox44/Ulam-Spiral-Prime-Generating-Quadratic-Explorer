name: Publish v1.4.2 release once
on:
  push:
    branches: [main]
    paths:
      - 'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.2.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release bundle
        run: |
          python3 scripts/verify_release.py --require-node
          node tests/worker_pool_race.js
      - name: Publish tag and release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.4.2 >/dev/null 2>&1; then
            echo 'v1.4.2 already exists; not publishing a duplicate.'
          else
            gh release create v1.4.2 \
              'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.2.html' \
              'checksums_v1.4.2.sha256' \
              --target "$GITHUB_SHA" \
              --title 'v1.4.2 — 100T performance & accuracy' \
              --notes-file RELEASE_NOTES_v1.4.2.md \
              --latest
          fi
