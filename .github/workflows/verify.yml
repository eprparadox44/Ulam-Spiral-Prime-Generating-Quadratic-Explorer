
name: Verify standalone HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check distribution, license, checksums and JavaScript syntax
        run: python3 scripts/verify_release.py --require-node
