name: Verify standalone HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check distribution, license, checksums and JavaScript syntax
        run: python3 scripts/verify_release.py --require-node
      - name: Regression-test Worker pool readiness
        run: node tests/worker_pool_race.js
      - name: Regression-test Klauber 1/8 geometry and c-search limits
        run: node tests/klauber_eighth_slope.js
      - name: Regression-test Hexagonal minimap outer-ring geometry
        run: node tests/hex_minimap_edge.js
      - name: Regression-test exact 100T Hex WASM modular arithmetic and bitmaps
        run: node tests/hex_wasm_100t.js
      - name: Regression-test source-free saved formula direct jump
        run: node tests/saved_jump_regression.js index.html
