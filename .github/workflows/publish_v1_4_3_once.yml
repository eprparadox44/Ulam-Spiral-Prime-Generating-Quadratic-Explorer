name: Publish v1.4.3 release (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_v1_4_3_once.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'eprparadox44/Ulam-Spiral-Prime-Generating-Quadratic-Explorer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone release and file checksum
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py --require-node
          sha256sum -c checksums_v1.4.3.sha256
          node tests/worker_pool_race.js
      - name: Publish v1.4.3 tag, notes and downloadable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.4.3 >/dev/null 2>&1; then
            echo "v1.4.3 already published"
          else
            gh release create v1.4.3 \
              'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.3.html' \
              checksums_v1.4.3.sha256 \
              --target 0576c6517c403771824dc43de58c5d5d514dee86 \
              --title 'v1.4.3 — 100T Optimized Release (FP10)' \
              --notes-file RELEASE_NOTES_v1.4.3.md \
              --latest
          fi
      - name: Verify release assets and published status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v1.4.3 --json tagName,name,isDraft,isPrerelease,assets
          mkdir -p "$RUNNER_TEMP/v143_release"
          # GitHub converts spaces to dots in attached asset filenames.
          gh release download v1.4.3 -p '*.html' --dir "$RUNNER_TEMP/v143_release"
          test "$(find "$RUNNER_TEMP/v143_release" -type f -name '*.html' | wc -l)" -eq 1
          expected="$(sha256sum 'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.3.html' | cut -d' ' -f1)"
          actual="$(sha256sum "$RUNNER_TEMP/v143_release/"*.html | cut -d' ' -f1)"
          test "$expected" = "$actual"
          gh release download v1.4.3 -p checksums_v1.4.3.sha256 --dir "$RUNNER_TEMP/v143_release"
          cmp -s checksums_v1.4.3.sha256 "$RUNNER_TEMP/v143_release/checksums_v1.4.3.sha256"
