name: Sync bilingual release notes (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v1.4.0-release-notes.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1.4.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.4.0 --notes-file RELEASE_NOTES_v1.4.0.md
