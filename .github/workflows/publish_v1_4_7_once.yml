name: Publish v1.4.7 (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_v1_4_7_once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'eprparadox44/Ulam-Spiral-Prime-Generating-Quadratic-Explorer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all previous functions and repaired saved jumps
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py --require-node
          sha256sum -c checksums_v1.4.7.sha256
          bash tests/run_all.sh
      - name: Publish release with standalone HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.4.7 >/dev/null 2>&1; then
            gh release create v1.4.7 \
              'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.7.html' \
              checksums_v1.4.7.sha256 \
              --target 88a3463a8be19a7e3c7845dd51ebabfdb367394f \
              --title 'v1.4.7 — Restore Saved Sequence Direct Jump' \
              --notes-file RELEASE_NOTES_v1.4.7.md \
              --latest
          fi
      - name: Re-download and verify published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download v1.4.7 -p '*.html' -p '*.sha256' --dir "$RUNNER_TEMP/release"
          want="$(sha256sum 'Ulam Spiral & Prime-Generating Quadratic Explorer v1.4.7.html' | cut -d' ' -f1)"
          got="$(sha256sum "$RUNNER_TEMP/release/"*.html | cut -d' ' -f1)"
          test "$want" = "$got"
          cmp -s checksums_v1.4.7.sha256 "$RUNNER_TEMP/release/checksums_v1.4.7.sha256"
          gh release view v1.4.7 --json tagName,isDraft,isPrerelease,assets
